global:
  registry: 796786461592.dkr.ecr.ap-south-1.amazonaws.com

images:
  auth:
    repository: auth
    tag: v1.0.969
  streaming:
    repository: streaming
    tag: v1.0.969
  admin:
    repository: admin
    tag: v1.0.969
  chat:
    repository: chat
    tag: v1.0.969
  frontend:
    repository: frontend
    tag: v1.0.969
