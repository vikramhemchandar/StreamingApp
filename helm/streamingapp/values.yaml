  AWS_REGION: "ap-south-1"
  AWS_S3_BUCKET: "vikramhemchandar-streamingapp"
  AWS_CDN_URL: "http://d1qh6zgebdak3q.cloudfront.net"

ingress:
  className: "nginx"
  host: "localhost"

replicaCount: 2
databaseReplicaCount: 1

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
